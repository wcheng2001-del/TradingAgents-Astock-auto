name: TradingAgents Astock Auto Analysis

on:
  schedule:
    # Tuesday, Thursday, Saturday Beijing 06:00 = previous UTC day 22:00
    - cron: "0 22 * * 1,3,5"
  workflow_dispatch:
    inputs:
      stock_list:
        description: "Comma-separated stock list"
        required: false
        default: ""
      provider:
        description: "LLM provider"
        required: false
        default: "deepseek"
        type: choice
        options:
          - deepseek
          - qwen-cn
      trade_date:
        description: "Optional trade date YYYY-MM-DD"
        required: false
        default: ""

concurrency:
  group: tradingagents-astock-auto
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run analysis
        env:
          STOCK_LIST: ${{ github.event.inputs.stock_list || vars.STOCK_LIST || '600519' }}
          TRADINGAGENTS_TRADE_DATE: ${{ github.event.inputs.trade_date || vars.TRADINGAGENTS_TRADE_DATE }}
          TRADINGAGENTS_LLM_PROVIDER: ${{ github.event.inputs.provider || vars.TRADINGAGENTS_LLM_PROVIDER || 'deepseek' }}
          TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.TRADINGAGENTS_DEEP_THINK_LLM || 'deepseek-v4-pro' }}
          TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.TRADINGAGENTS_QUICK_THINK_LLM || 'deepseek-v4-flash' }}
          TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ vars.TRADINGAGENTS_OUTPUT_LANGUAGE || 'Chinese' }}
          TRADINGAGENTS_RESULTS_DIR: reports/auto
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'TradingAgents Astock Auto' }}
        run: python scripts/auto_batch.py

      - name: Upload reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tradingagents-astock-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
